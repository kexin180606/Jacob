<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unblocker</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background: #0f0f12; color: #fff; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #4f46e5; }
        .search-box { display: flex; gap: 10px; background: #1f1f2e; padding: 8px; border-radius: 8px; border: 1px solid #373750; }
        input { flex: 1; padding: 12px; background: transparent; border: none; color: white; font-size: 16px; outline: none; }
        button { padding: 12px 24px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 HTML Proxy Unblocker</h1>
        <p>在下方输入网址，将在隐藏历史记录的新标签页中打开：</p>
        <div class="search-box">
            <input type="text" id="target-url" placeholder="例如: wikipedia.org">
            <button onclick="unblockSite()">Launch</button>
        </div>
    </div>
    <script>
        function unblockSite() {
            let input = document.getElementById('target-url').value.trim();
            if (!input) return alert('请输入网址');
            
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                input = 'https://' + input;
            }
            
            // 1. 先弹出一个完全没有历史痕迹的空白隐藏新标签页
            let newTab = window.open('about:blank', '_blank');
            if (!newTab) {
                alert('弹窗被浏览器拦截了！请允许此网站的弹窗权限。');
                return;
            }
            
            // 2. 彻底粉碎黑屏机制：直接整页跳转到顶级独立无视封锁的代理网关上
            newTab.location.href = "https://unblocker.cc" + input;
        }
    </script>
</body>
</html>
